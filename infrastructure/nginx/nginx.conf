events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream Services
    upstream core_api {
        server core-api:8080;
    }

    upstream realtime_api {
        server realtime-api:3001;
    }

    upstream notification_api {
        server notification-api:3002;
    }

    server {
        listen 80;
        server_name localhost;

        # Core Spring Boot REST API
        location /api/v1/ {
            proxy_pass http://core_api/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # Realtime WebSocket API
        location /realtime/ {
            proxy_pass http://realtime_api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # Notification Service
        location /notifications/ {
            proxy_pass http://notification_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /healthz {
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }
    }
}
