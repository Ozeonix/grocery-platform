events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Rate limiting zone for API protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Upstream Microservice Containers
    upstream core_api {
        server core-api:8080;
        keepalive 32;
    }

    upstream realtime_api {
        server realtime-api:3001;
        keepalive 32;
    }

    upstream notification_api {
        server notification-api:3002;
        keepalive 16;
    }

    # 1. HTTP Server - Redirect to HTTPS and ACME challenge
    server {
        listen 80;
        listen [::]:80;
        server_name grocery.ozeonix.com api.ozeonix.com;

        # Let's Encrypt / Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Global HTTP to HTTPS redirect
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Production HTTPS Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name grocery.ozeonix.com api.ozeonix.com;

        # TLS Certificates (Mounted via Let's Encrypt volume)
        ssl_certificate /etc/letsencrypt/live/grocery.ozeonix.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/grocery.ozeonix.com/privkey.pem;

        # Modern TLS Security Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Core Spring Boot REST API
        location /api/v1/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://core_api/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
        }

        # Auth Rate-Limited Endpoint
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://core_api/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Realtime Socket.IO WebSockets
        location /realtime/ {
            proxy_pass http://realtime_api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Notification Dispatch Service
        location /notifications/ {
            proxy_pass http://notification_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Edge Health Check Endpoint
        location /healthz {
            return 200 '{"status":"UP","gateway":"ozeonix-edge-nginx","tls":true}';
            add_header Content-Type application/json;
        }
    }
}
