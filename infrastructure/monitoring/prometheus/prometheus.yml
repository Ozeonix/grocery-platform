global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'core-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['core-api:8080']

  - job_name: 'realtime-api'
    metrics_path: '/healthz'
    static_configs:
      - targets: ['realtime-api:3001']

  - job_name: 'notification-api'
    metrics_path: '/healthz'
    static_configs:
      - targets: ['notification-api:3002']
