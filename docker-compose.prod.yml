version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: grocery-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grocery}
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grocery} -d ${POSTGRES_DB:-grocery}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grocery-network

  redis:
    image: redis:7-alpine
    container_name: grocery-prod-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - grocery-network

  minio:
    image: pgsty/minio:latest
    container_name: grocery-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ozeonix-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ozeonix-super-secret}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - grocery-network

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: grocery-prod-core-api
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-grocery}
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORE_API_PORT: 8080
    ports:
      - "${CORE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grocery-network

  realtime-api:
    build:
      context: ./services/realtime-api
      dockerfile: Dockerfile
    container_name: grocery-prod-realtime-api
    restart: always
    environment:
      REALTIME_API_PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "${REALTIME_API_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - grocery-network

  notification-api:
    build:
      context: ./services/notification-api
      dockerfile: Dockerfile
    container_name: grocery-prod-notification-api
    restart: always
    environment:
      NOTIFICATION_API_PORT: 3002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-grocery}
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    ports:
      - "${NOTIFICATION_API_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grocery-network

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: grocery-prod-worker
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-grocery}
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - grocery-network

  gateway:
    image: nginx:alpine
    container_name: grocery-prod-gateway
    restart: always
    ports:
      - "${GATEWAY_HTTP_PORT:-8088}:80"
      - "${GATEWAY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - core-api
      - realtime-api
      - notification-api
    networks:
      - grocery-network

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  grocery-network:
    driver: bridge
